plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

apply from: 'extract_input.gradle'

loom {
	splitEnvironmentSourceSets()
	mods {
		"be-kongs-ai-chat-mod" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

// ── Exclude broken bracket-prefixed stub files from compilation ────────────
tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach { task ->
	if (task.name == 'compileClientJava' || task.name == 'compileJava') {
		task.exclude '**/[Double*.java'
		task.exclude '**/[DoubleEdit*.java'
		task.exclude '**/[*].java'
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName
	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

// ── Inspect real 26.x API signatures via reflection (sources jar unavailable) ──
// Usage: gradlew dumpClassApi -Pclasses=net.minecraft.client.input.KeyEvent,net.minecraft.client.gui.screens.Screen
tasks.register('dumpClassApi') {
	doLast {
		def list = (project.findProperty('classes') ?: 'net.minecraft.client.input.KeyEvent').split(',')*.trim()
		def urls = sourceSets.client.compileClasspath.files.collect { it.toURI().toURL() } as URL[]
		def loader = new URLClassLoader(urls, (ClassLoader) null)
		list.each { cn ->
			try {
				def c = loader.loadClass(cn)
				println "== $cn =="
				try {
					c.declaredConstructors.each { ct ->
						println "  C: ${java.lang.reflect.Modifier.toString(ct.modifiers)} ${c.simpleName}(${ct.parameterTypes.collect { it.simpleName }.join(', ')})"
					}
				} catch (Throwable t) { println "  (constructors unavailable: $t)" }
				try {
					def methods = c.declaredMethods
					if (methods != null) {
						methods.sort { it.name }.each { m ->
							println "  M: ${java.lang.reflect.Modifier.toString(m.modifiers)} ${m.returnType.simpleName} ${m.name}(${m.parameterTypes.collect { it.simpleName }.join(', ')})"
						}
					} else { println "  (declaredMethods returned null)" }
				} catch (Throwable t) { println "  (methods unavailable: $t)" }
				try {
					c.declaredFields.each { f ->
						println "  F: ${java.lang.reflect.Modifier.toString(f.modifiers)} ${f.type.simpleName} ${f.name}"
					}
				} catch (Throwable t) { println "  (fields unavailable: $t)" }
				c.declaredClasses.each { inner ->
					println "  INNER: ${inner.simpleName}"
					if (inner.isEnum()) {
						inner.enumConstants.each { println "    CONST: $it" }
					}
				}
			} catch (Throwable t) {
				println "ERR $cn: $t"
			}
		}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
	repositories { }
}
